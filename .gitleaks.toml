# Repository-specific secret-scanning allowlist.
#
# Extends the global rules rather than replacing them, so every default
# detector stays active.
[extend]
useDefault = true

[allowlist]
description = "Figma file key — a public document identifier, not a credential"
# The key appears in the design's share URL
# (figma.com/design/OxxksZFS8hzKoFTeSRdFGs/Conloca), in docs/figma/DESIGN-SPEC.md,
# and in scripts/figma-export.ts. It identifies which file to read; access is
# granted by FIGMA_PAT, which lives in the gitignored .env and is never
# committed. The generic-api-key rule matches it purely on shape.
regexes = ['''OxxksZFS8hzKoFTeSRdFGs''']
